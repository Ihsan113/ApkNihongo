name: BetterSeed Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify transparent garden assets
        run: python3 scripts/verify_visual_assets.py

      - name: Verify committed native sources
        run: python3 scripts/verify_android_integration.py --sources

      - name: Test signing configuration patch
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Generate Android platform (prototype repository)
        run: flutter create --no-pub --project-name betterseed --org com.example --platforms=android .

      - name: Prepare Android name and app icons
        run: python3 scripts/prepare_android.py

      - name: Verify Android integration
        run: python3 scripts/verify_android_integration.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test --reporter expanded

      # Release artifacts are intentionally NOT published from pull requests:
      # PRs (especially forks) do not have access to the signing secrets.
      - name: Configure persistent release signing
        if: github.event_name != 'pull_request'
        env:
          BETTERSEED_KEYSTORE_BASE64: ${{ secrets.BETTERSEED_KEYSTORE_BASE64 }}
          BETTERSEED_KEYSTORE_PASSWORD: ${{ secrets.BETTERSEED_KEYSTORE_PASSWORD }}
          BETTERSEED_KEY_ALIAS: ${{ secrets.BETTERSEED_KEY_ALIAS }}
          BETTERSEED_KEY_PASSWORD: ${{ secrets.BETTERSEED_KEY_PASSWORD }}
          BETTERSEED_PINNED_SHA1: ${{ vars.BETTERSEED_PINNED_SHA1 }}
        run: python3 scripts/configure_android_signing.py

      - name: Build APK with stable release certificate
        if: github.event_name != 'pull_request'
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.BETTERSEED_GOOGLE_WEB_CLIENT_ID }}
        run: flutter build apk --release --dart-define="BETTERSEED_GOOGLE_SERVER_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"

      - name: Verify APK signature matches stable SHA-1
        if: github.event_name != 'pull_request'
        run: python3 scripts/verify_signed_apk.py

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: BetterSeed-stable-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/CERTIFICATE_SHA1_README.txt
          if-no-files-found: error
          retention-days: 14
