name: Build NihonGo Native Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      NIHONGO_KEYSTORE_PASSWORD: ${{ secrets.NIHONGO_KEYSTORE_PASSWORD }}
      NIHONGO_KEY_ALIAS: ${{ secrets.NIHONGO_KEY_ALIAS }}
      NIHONGO_KEY_PASSWORD: ${{ secrets.NIHONGO_KEY_PASSWORD }}
      EXPECTED_SHA1: 90C46BCA94D902D4D761E4DAB85053267369AB31
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Do not request the deprecated Google SDK package named 'tools'.
          packages: 'platform-tools'
      - name: Install Android SDK Platform 36 and Build Tools 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Siapkan keystore dari GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.NIHONGO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nihongo.keystore"
            echo "NIHONGO_KEYSTORE_PATH=$RUNNER_TEMP/nihongo.keystore" >> "$GITHUB_ENV"
            echo "Keystore dari Secrets dipakai."
          else
            echo "::warning::Secret NIHONGO_KEYSTORE_BASE64 belum diset - pakai app/debug.keystore (SHA-1 TIDAK akan sama dengan yang terdaftar)."
          fi
      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Cek SHA-1 sertifikat APK
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          ACTUAL=$($APKSIGNER verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-1" | head -1 | sed 's/.*: *//' | tr -d ': ' | tr a-f A-F)
          echo "SHA-1 APK    : $ACTUAL"
          echo "SHA-1 diharap: $EXPECTED_SHA1"
          if [ "$ACTUAL" = "$EXPECTED_SHA1" ]; then echo "COCOK"; else echo "::warning::SHA-1 APK TIDAK cocok dengan yang terdaftar."; fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NihonGo-Native-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
