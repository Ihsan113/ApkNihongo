name: betterseed
description: An offline-first visual habit and goal garden prototype.
publish_to: none
version: 1.2.3+34

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
  google_sign_in: ^7.2.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/trees/
    - assets/images/trees/skins/moonlight/
    - assets/images/backgrounds/
    - assets/images/effects/
    - assets/icon_512.png
    - assets/audio/
